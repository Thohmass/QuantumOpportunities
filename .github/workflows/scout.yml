# Data agent: looks for new events (agents/scout.md, docs/04-data-pipeline.md).
# Claude only reads the web and edits files under data/. Deterministic steps before and after it prepare the
# inputs, check that only data/ changed, validate, and open the PR as the Claude App.
name: Scout

on:
  schedule:
    - cron: "41 4 * * 3" # Wednesday, 04:41 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test run: no data PR; the report and the data diff go to the log and the run summary"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: data-agents
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  scout:
    name: scout
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts

      # A run is a test run (dry) when asked for, and always when it isn't on main: it never opens a data PR, so
      # nothing from a branch can reach main. A dry run also ignores open data PRs.
      - name: Skip if an earlier data PR is still open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY: ${{ inputs.dry_run == true || github.ref != 'refs/heads/main' }}
        run: |
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          if [ "$DRY" = "true" ]; then echo "open=0" >> "$GITHUB_OUTPUT"; echo "::notice::Test run: no data PR."; exit 0; fi
          n=$(gh pr list -R "$REPO" --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("data/"))] | length')
          echo "open=$n" >> "$GITHUB_OUTPUT"
          [ "$n" = "0" ] || echo "::notice::An agent data PR is still open; skipping this run."

      - name: Index, sources, queries and suggestions (no AI)
        if: steps.open.outputs.open == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .run
          npm run --silent index > .run/index.txt
          npm run --silent scout-prep
          gh issue list -R "$REPO" --label suggestion --state open --limit 20 --json number,title,body > .run/suggestions.json || echo '[]' > .run/suggestions.json
          wc -l .run/index.txt .run/sources.txt .run/queries.txt

      # A real browser for pages a plain fetch can't read (blocked or JavaScript-only), issue #41. Exact version
      # from tool/scout-browser's lockfile, headless, in-memory profile. The agent may only open, read, wait and
      # close (allowedTools below); clicking, typing, uploads and running code are refused.
      - name: Browser for the agent (Playwright MCP)
        if: steps.open.outputs.open == '0'
        run: |
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs; allow them, keep the sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm ci --prefix tool/scout-browser --ignore-scripts --no-audit --no-fund
          mkdir -p .run/browser
          jq -n --arg cli "$PWD/tool/scout-browser/node_modules/@playwright/mcp/cli.js" --arg out "$PWD/.run/browser" '{
            mcpServers: { playwright: { command: "node", args: [
              $cli, "--headless", "--isolated", "--browser", "chrome",
              "--image-responses", "omit", "--block-service-workers", "--output-dir", $out ] } } }' \
            > "$RUNNER_TEMP/mcp.json"

      # Devpost's official MCP server (issue #46), with a read-only token from the project account. Only read
      # tools are allowed (scripts/lib/devpost.ts); without the secret, or on any error, the Scout runs without it.
      - name: Devpost for the agent (official MCP)
        id: devpost
        if: steps.open.outputs.open == '0'
        env:
          DEVPOST_MCP_TOKEN: ${{ secrets.DEVPOST_MCP_TOKEN }}
        run: npx tsx scripts/devpost-tools.ts "$RUNNER_TEMP/mcp.json"

      - name: "Scout agent, phase 1 of 3: leads, suggestions and feeds"
        id: phase1
        if: ${{ !cancelled() && steps.open.outputs.open == '0' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        env:
          # Read by Claude Code to fill the devpost server's header; never written to a file.
          DEVPOST_MCP_TOKEN: ${{ secrets.DEVPOST_MCP_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The agent needs no GitHub access: give it this run's read-only token instead of exchanging one for
          # the Claude App (that exchange refuses any workflow that differs from main, so test runs couldn't run).
          github_token: ${{ github.token }}
          prompt: |
            You are the Scout data agent of Quantum Opportunities. Today is the date of this run.
            Read CLAUDE.md, agents/common-rules.md and agents/scout.md. This run has three phases (see "Phases" in
            agents/scout.md); this is phase 1 of 3: steps 1 (leads and suggestions) and 3 (feeds). Do only these steps, and do them fully.
            Read .run/phases.md first (notes from earlier phases, if any) and stay within the caps left.
            Append your section "## Phase 1: leads, suggestions and feeds" to .run/report.md and your notes to the research log.
            Before you finish, append to .run/phases.md: what you did, candidates processed, new events, fetches used.
            Finish with `npm run data:check` passing.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --mcp-config ${{ runner.temp }}/mcp.json
            --allowedTools "${{ steps.devpost.outputs.allowed }}mcp__playwright__browser_navigate,mcp__playwright__browser_navigate_back,mcp__playwright__browser_snapshot,mcp__playwright__browser_wait_for,mcp__playwright__browser_close,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(npm run data:check),Bash(npm run --silent data:check),Bash(npm run -s data:check),Bash(npm run find-similar:*),Bash(npm run --silent find-similar:*),Bash(npm run -s find-similar:*),Bash(npm run index),Bash(npm run --silent index),Bash(npm run -s index),Bash(npm run queue:*),Bash(npm run -s queue:*)"

      # Each phase writes the same execution file: move it aside for the diagnostics below.
      - name: Keep phase 1's transcript summary
        if: ${{ !cancelled() }}
        run: mv "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/phase1.json" 2>/dev/null || true

      - name: "Scout agent, phase 2 of 3: sources"
        id: phase2
        if: ${{ !cancelled() && steps.open.outputs.open == '0' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        env:
          # Read by Claude Code to fill the devpost server's header; never written to a file.
          DEVPOST_MCP_TOKEN: ${{ secrets.DEVPOST_MCP_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The agent needs no GitHub access: give it this run's read-only token instead of exchanging one for
          # the Claude App (that exchange refuses any workflow that differs from main, so test runs couldn't run).
          github_token: ${{ github.token }}
          prompt: |
            You are the Scout data agent of Quantum Opportunities. Today is the date of this run.
            Read CLAUDE.md, agents/common-rules.md and agents/scout.md. This run has three phases (see "Phases" in
            agents/scout.md); this is phase 2 of 3: step 2 (sources in .run/sources.txt). Do only these steps, and do them fully.
            Read .run/phases.md first (notes from earlier phases, if any) and stay within the caps left.
            Append your section "## Phase 2: sources" to .run/report.md and your notes to the research log.
            Before you finish, append to .run/phases.md: what you did, candidates processed, new events, fetches used.
            Finish with `npm run data:check` passing.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --mcp-config ${{ runner.temp }}/mcp.json
            --allowedTools "${{ steps.devpost.outputs.allowed }}mcp__playwright__browser_navigate,mcp__playwright__browser_navigate_back,mcp__playwright__browser_snapshot,mcp__playwright__browser_wait_for,mcp__playwright__browser_close,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(npm run data:check),Bash(npm run --silent data:check),Bash(npm run -s data:check),Bash(npm run find-similar:*),Bash(npm run --silent find-similar:*),Bash(npm run -s find-similar:*),Bash(npm run index),Bash(npm run --silent index),Bash(npm run -s index),Bash(npm run queue:*),Bash(npm run -s queue:*)"

      # Each phase writes the same execution file: move it aside for the diagnostics below.
      - name: Keep phase 2's transcript summary
        if: ${{ !cancelled() }}
        run: mv "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/phase2.json" 2>/dev/null || true

      - name: "Scout agent, phase 3 of 3: searches and Devpost"
        id: phase3
        if: ${{ !cancelled() && steps.open.outputs.open == '0' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        env:
          # Read by Claude Code to fill the devpost server's header; never written to a file.
          DEVPOST_MCP_TOKEN: ${{ secrets.DEVPOST_MCP_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The agent needs no GitHub access: give it this run's read-only token instead of exchanging one for
          # the Claude App (that exchange refuses any workflow that differs from main, so test runs couldn't run).
          github_token: ${{ github.token }}
          prompt: |
            You are the Scout data agent of Quantum Opportunities. Today is the date of this run.
            Read CLAUDE.md, agents/common-rules.md and agents/scout.md. This run has three phases (see "Phases" in
            agents/scout.md); this is phase 3 of 3: steps 4 (searches in .run/queries.txt) and 7 (Devpost). Do only these steps, and do them fully.
            Read .run/phases.md first (notes from earlier phases, if any) and stay within the caps left.
            Append your section "## Phase 3: searches and Devpost" to .run/report.md and your notes to the research log.
            Before you finish, append to .run/phases.md: what you did, candidates processed, new events, fetches used.
            As the last phase, also add the single data/runs.yaml line for the whole run.
            Finish with `npm run data:check` passing.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --mcp-config ${{ runner.temp }}/mcp.json
            --allowedTools "${{ steps.devpost.outputs.allowed }}mcp__playwright__browser_navigate,mcp__playwright__browser_navigate_back,mcp__playwright__browser_snapshot,mcp__playwright__browser_wait_for,mcp__playwright__browser_close,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(npm run data:check),Bash(npm run --silent data:check),Bash(npm run -s data:check),Bash(npm run find-similar:*),Bash(npm run --silent find-similar:*),Bash(npm run -s find-similar:*),Bash(npm run index),Bash(npm run --silent index),Bash(npm run -s index),Bash(npm run queue:*),Bash(npm run -s queue:*)"

      # Each phase writes the same execution file: move it aside for the diagnostics below.
      - name: Keep phase 3's transcript summary
        if: ${{ !cancelled() }}
        run: mv "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/phase3.json" 2>/dev/null || true

      # Diagnostics: which tool calls were refused in each phase (tool name and the start of its input), so runs that
      # stop early can be understood without exposing the whole transcript in public logs.
      - name: Refused tool calls
        if: ${{ !cancelled() }}
        run: |
          for n in 1 2 3; do
            f="$RUNNER_TEMP/phase$n.json"
            [ -f "$f" ] || { echo "Phase $n: no transcript"; continue; }
            jq -r --arg n "$n" '.[] | select(.type == "result") | "Phase \($n): \(.num_turns) turns, \(.permission_denials | length) refused", (.permission_denials[]? | "  \(.tool_name): \(.tool_input | tostring | .[0:240])")' "$f" || true
          done

      - name: Only data/ changed, and the data is valid
        if: ${{ !cancelled() && steps.open.outputs.open == '0' }}
        id: guard
        run: |
          outside=$(git status --porcelain --untracked-files=all -- . ':!data' ':!.run' | wc -l)
          protected=$(git status --porcelain --untracked-files=all -- data/taxonomy data/LICENSE | wc -l)
          if [ "$outside" != "0" ] || [ "$protected" != "0" ]; then
            git status --porcelain --untracked-files=all
            echo "::error::The agent changed files outside data/ (or protected data files). Nothing is committed."
            exit 1
          fi
          npm run data:check
          echo "changed=$(git status --porcelain --untracked-files=all -- data | wc -l)" >> "$GITHUB_OUTPUT"

      # The agent only gets this run's read-only token, so the PR is opened with DATA_PR_TOKEN: a
      # fine-grained token limited to this repository (contents + pull requests). The agent never sees it, and PRs
      # opened with it trigger CI (GITHUB_TOKEN PRs would not). pr-policy still decides on auto-merge.
      - name: "Test run: report and data diff"
        if: ${{ !cancelled() && steps.open.outputs.dry == 'true' }}
        run: |
          git add -N data
          {
            [ -f .run/report.md ] && cat .run/report.md || echo "_The agent wrote no report._"
            echo; echo "### Data changes"; echo '```'; git diff --stat -- data; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::group::Full data diff"
          git diff -- data
          echo "::endgroup::"

      - name: Open the data PR
        if: steps.open.outputs.dry != 'true' && steps.guard.outputs.changed != '0' && steps.guard.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.DATA_PR_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Secret DATA_PR_TOKEN is missing (docs/03-dev-pipeline.md §6)."; exit 1; }
          branch="data/scout/$(date -u +%F)-${GITHUB_RUN_ID}"
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data
          git commit -q -m "Scout run $(date -u +%F)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          {
            [ -f .run/report.md ] && cat .run/report.md || echo "_The agent wrote no report._"
            echo; echo "---"
            echo "[Workflow run]($RUN_URL) · automated data PR: merges on its own when every check passes."
          } > .run/body.md
          gh pr create -R "$REPO" --head "$branch" --base main --title "Data: Scout run $(date -u +%F)" --body-file .run/body.md
